name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Analyze samples (dogfooding)
        run: |
          dotnet run --project src/PlsqlDoctor.Cli -c Release --no-build -- \
            analyze samples --format markdown --out report.md --fail-on none
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fixed sample must stay clean
        run: |
          dotnet run --project src/PlsqlDoctor.Cli -c Release --no-build -- \
            analyze samples/order_processing_fixed.sql --fail-on info

      - name: SARIF output is valid JSON
        run: |
          dotnet run --project src/PlsqlDoctor.Cli -c Release --no-build -- \
            analyze samples --format sarif --out plsql-doctor.sarif --fail-on none
          jq -e '.version == "2.1.0" and (.runs[0].results | length) > 0' plsql-doctor.sarif

      - name: Pack and smoke-test the global tool
        run: |
          dotnet pack src/PlsqlDoctor.Cli -c Release --no-build -o ./nupkg
          dotnet tool install --tool-path ./.tools --add-source ./nupkg PlsqlPerformanceDoctor
          ./.tools/plsql-doctor --version
          ./.tools/plsql-doctor analyze samples/order_processing_fixed.sql --fail-on info

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
